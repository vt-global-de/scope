name: Bug report
description: Report a reproducible problem in Scope.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove credentials, internal hostnames and other sensitive data from logs and configuration excerpts.
  - type: input
    id: version
    attributes:
      label: Scope version
      description: Use the exact image tag or version shown in the UI.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Docker CLI
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Include redacted logs, browser details, health output or the smallest relevant inventory excerpt.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, tokens and private infrastructure details.
          required: true
        - label: This is not a security vulnerability.
          required: true

