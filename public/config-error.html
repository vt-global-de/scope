<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scope · Configuration error</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/config-error.css">
  </head>
  <body>
    <main class="error-shell">
      <section class="error-card">
        <div class="scope-mark" aria-hidden="true"><i></i><span>!</span></div>
        <p class="eyebrow">SCOPE · SAFE MODE</p>
        <h1>Configuration could not be loaded.</h1>
        <p class="intro">Scope is running, but the inventory is invalid. Correct the reported field and reload this page.</p>
        <div class="diagnostic">
          <span>Inventory diagnostic</span>
          <code id="config-error">Checking configuration …</code>
          <small id="config-file"></small>
        </div>
        <div class="actions">
          <button id="retry-button" type="button">Check again</button>
          <span>The container stays unhealthy until validation succeeds.</span>
        </div>
      </section>
    </main>
    <script type="module" src="/config-error.js"></script>
  </body>
</html>
